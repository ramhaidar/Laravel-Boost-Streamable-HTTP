version: 2

# Dependabot runs once a month (first day of the month) to reduce
# GitHub Actions storage/minute usage. Change `interval` back to
# `weekly` if you want more frequent updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    versioning-strategy: increase-if-necessary
